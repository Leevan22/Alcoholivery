<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcoholivery - Delivery Nocturno</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        :root {
            --brand-primary: #0f172a;
            --brand-accent: #f59e0b;
            --brand-accent-hover: #d97706;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* Navbar elegante con efecto Blur */
        .navbar-custom {
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff !important;
        }

        .navbar-brand span {
            color: var(--brand-accent);
        }

        /* Tarjetas de Producto Modernas */
        .card-product {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #ffffff;
            overflow: hidden;
        }

        .card-product:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        .product-img-wrapper {
            height: 200px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .product-img-wrapper img {
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card-product:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        /* Botones Personalizados */
        .btn-accent {
            background-color: var(--brand-accent);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s ease;
        }

        .btn-accent:hover {
            background-color: var(--brand-accent-hover);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-outline-custom {
            border: 1px solid #cbd5e1;
            color: #334155;
            font-weight: 600;
            border-radius: 10px;
        }

        .btn-outline-custom:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* Badges & Encabezados */
        .badge-age {
            background-color: #10b981;
            color: #ffffff;
            font-weight: 600;
            padding: 0.4em 0.8em;
            border-radius: 20px;
        }

        .price-tag {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* Alert Stylings */
        .alert {
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fs-4" href="{% url 'catalogo' %}">🍺 Alcohol<span>ivery</span></a>
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-2">
                    <span class="text-slate-300 me-2 text-white-50 small d-none d-md-inline">Hola, <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'catalogo' %}" class="btn btn-outline-custom btn-sm text-white border-secondary">Catálogo</a>
                    <a href="{% url 'ver_carro' %}" class="btn btn-accent btn-sm">
                        🛒 Carro <span class="badge bg-dark text-white rounded-pill ms-1">{{ user.carro.obtener_total_items|default:0 }}</span>
                    </a>
                    <a href="{% url 'mis_pedidos' %}" class="btn btn-outline-custom btn-sm text-white border-secondary">Mis Pedidos</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm rounded-3 ms-1">Salir</a>
                </div>
            {% endif %}
        </div>
    </nav>

    <!-- Content -->
    <div class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show fw-medium" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
